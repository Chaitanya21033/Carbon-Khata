[project]
name = "carbonkhata-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "pydantic>=2.7", "pydantic-settings>=2.3",
  "psycopg[binary]>=3.2", "apscheduler>=3.10,<4", "paho-mqtt>=2.1", "pyjwt>=2.8", "httpx>=0.27", "pulp>=2.8", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../sim"]
